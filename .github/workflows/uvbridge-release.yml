# UV Bridge releases: when a commit on uvbridge adds an APK as
# tools/uvbridge/release/uvbridge-<version>.apk, publish it as the release
# uvbridge-v<version> (tag created here, on that commit) with the notes in
# tools/uvbridge/release/uvbridge-<version>.md. Versions already released
# are left alone, so a change to this file also publishes any APK not yet
# released.
name: UV Bridge release

on:
  push:
    branches: [uvbridge]
    paths: ['tools/uvbridge/release/*.apk', '.github/workflows/uvbridge-release.yml']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish new versions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd tools/uvbridge/release
          for apk in uvbridge-*.apk; do
            VERSION="${apk#uvbridge-}"; VERSION="${VERSION%.apk}"
            TAG="uvbridge-v$VERSION"
            if gh release view "$TAG" >/dev/null 2>&1; then continue; fi
            gh release create "$TAG" "$apk" --target "$GITHUB_SHA" \
              --title "UV Bridge $VERSION" --notes-file "uvbridge-$VERSION.md"
          done
